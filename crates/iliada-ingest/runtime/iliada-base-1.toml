# The Iliada runtime base, ABI version 1.
#
# Every bundle declares `runtime = "iliada-base-1"` in Info.toml and may assume
# that the sonames below are provided by the platform (they are part of the
# dm-verity protected system image and mapped read-only into every sandbox).
# Anything not listed here must be bundled.
#
# Keep this list *small*: everything in it becomes a compatibility promise.
# It is the analogue of a Flatpak runtime / the macOS system frameworks.

name = "iliada-base-1"

sonames = [
  # glibc
  "ld-linux-x86-64.so.2", "ld-linux-aarch64.so.1",
  "libc.so.6", "libm.so.6", "libpthread.so.0", "libdl.so.2", "librt.so.1",
  "libresolv.so.2", "libutil.so.1", "libanl.so.1", "libmvec.so.1",
  "libcrypt.so.1",
  # GCC runtime
  "libgcc_s.so.1", "libstdc++.so.6",
  # graphics / display (GPU drivers must come from the host image)
  "libGL.so.1", "libGLX.so.0", "libEGL.so.1", "libGLESv2.so.2", "libvulkan.so.1",
  "libgbm.so.1", "libdrm.so.2",
  "libwayland-client.so.0", "libwayland-cursor.so.0", "libwayland-egl.so.1",
  "libxkbcommon.so.0",
  # audio (brokered through PipeWire)
  "libasound.so.2", "libpipewire-0.3.so.0", "libpulse.so.0",
  # fonts
  "libfontconfig.so.1", "libfreetype.so.6",
]

# Debian package names that are satisfied by the runtime base. Dependency
# edges into these packages are not followed.
packages = [
  "libc6", "libc-bin", "libgcc-s1", "libstdc++6", "libcrypt1",
  "libgl1", "libglx0", "libegl1", "libgles2", "libvulkan1", "libgbm1", "libdrm2",
  "libwayland-client0", "libwayland-cursor0", "libwayland-egl1", "libxkbcommon0",
  "libasound2", "libasound2t64", "libpipewire-0.3-0", "libpipewire-0.3-0t64",
  "libpulse0", "libfontconfig1", "libfreetype6",
]
