[package]
name = "iliada-assistant"
description = "The Iliada assistant: Claude, acting only through Iliada's own operations (apps, tools, services, updates, backups, permissions)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
iliada-system.workspace = true
iliada-store.workspace = true
iliada-bundle.workspace = true
iliada-types.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
toml.workspace = true
# Email from the user's own account (rustls, like the rest of Iliada).
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net"] }
tempfile.workspace = true

[lints]
workspace = true
