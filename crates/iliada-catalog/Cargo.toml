[package]
name = "iliada-catalog"
description = "The Iliada app catalog: format, signatures, and (feature `builder`) the catalog builder."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# The build-server tool (`iliada-catalog`): recipes -> signed .app archives.
builder = ["dep:iliada-ingest", "dep:iliada-bundle", "dep:tokio", "dep:clap", "dep:tar", "dep:zstd", "dep:getrandom", "dep:sha2", "dep:hex", "dep:toml", "dep:tracing-subscriber"]

[[bin]]
name = "iliada-catalog"
path = "src/bin/iliada-catalog.rs"
required-features = ["builder"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
ed25519-dalek = "2"
base64 = "0.22"
iliada-ingest = { path = "../iliada-ingest", optional = true }
iliada-bundle = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
tar = { version = "0.4", optional = true }
zstd = { version = "0.13", optional = true }
getrandom = { version = "0.3", optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[lints]
workspace = true
