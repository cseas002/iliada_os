[package]
name = "iliada-store-gui"
description = "The Iliada Store (COSMIC GUI)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "iliada-store-gui"
path = "src/main.rs"

[dependencies]
iliada-store = { path = "../../crates/iliada-store" }
iliada-catalog = { path = "../../crates/iliada-catalog" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "430f3d48a97d8779f9c1985473912e594ccca1ae"
default-features = false
features = ["tokio", "winit", "wayland", "multi-window", "wgpu"]
