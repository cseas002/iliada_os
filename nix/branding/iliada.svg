<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Iliada</title>
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4cb78"/>
      <stop offset="0.5" stop-color="#cf8f33"/>
      <stop offset="1" stop-color="#8c5a1b"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8493c"/>
      <stop offset="1" stop-color="#a8231b"/>
    </linearGradient>
  </defs>
  <!-- Crest: horsehair arching from the brow to the back -->
