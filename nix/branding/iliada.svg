    M62 118 C 66 84, 104 70, 146 72 C 188 74, 214 98, 214 138
    L 212 184 C 212 200, 220 210, 234 216 C 222 226, 196 228, 178 220
    C 166 214, 160 204, 160 190 L 160 172
    C 146 170, 134 178, 128 192 L 118 228 C 114 240, 100 244, 90 236
    C 74 222, 64 196, 62 168 Z
    M70 136 C 86 124, 112 124, 132 134 C 116 146, 90 148, 72 144 C 68 142, 68 139, 70 136 Z"/>
