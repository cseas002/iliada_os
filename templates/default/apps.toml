# Your apps. Iliada keeps this list up to date for you: apps you drag into
# Applications are added, apps you drag to the Trash are removed. When this
# configuration is restored on a new computer, these apps install themselves.
#
# You may also add entries by hand (no rebuild needed):
#   debian = "<package>"   a package from Debian stable
#   url    = "<https url>" a .deb published by the app's developer

interval_secs = 21600   # check for updates every 6 hours

[[watch]]
debian = "gnome-calculator"

[[watch]]
debian = "gnome-text-editor"
