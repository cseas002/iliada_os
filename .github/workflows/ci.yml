name: ci

# Runs on release tags only (and on demand from the Actions tab), to keep
# private-repo Actions minutes low. Day-to-day checks run locally
# (`cargo xtask ci`) and on the dev server (`nix flake check`).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      - name: Evaluate the appliance image and dev VM
        run: |
          nix eval --raw .#nixosConfigurations.appliance-x86_64.config.system.build.image.drvPath
          nix eval --raw .#nixosConfigurations.dev-vm-x86_64.config.system.build.vm.drvPath
